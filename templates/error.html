{% extends "base.html" %}
{% block title %}{{ code }} — SecureShare{% endblock %}
{% block content %}

<div class="error-wrapper">

  <!-- Glowing orb behind number -->
  <div class="error-relative">
    <div class="error-orb"></div>
    <div class="error-code">{{ code }}</div>
  </div>

  <p class="error-subtitle">
    {{ message }}
  </p>

  <a class="btn btn-dark px-4 py-2" href="{{ url_for('index') }}">
    ← Return Home
  </a>

  <div class="error-footer">
    SecureShare // encrypted file transfer
  </div>
</div>

{% endblock %}
