{% extends "base.html" %}
{% block title %}Login — SecureShare{% endblock %}
{% block content %}

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-card-inner">

      <!-- Logo & Hero -->
      <div class="auth-logo">
        <div class="logo-icon" aria-hidden="true">🔐</div>
        <h1>SecureShare</h1>
        <p>// end-to-end encrypted file transfer</p>
      </div>

      <!-- Login Card -->
      <div class="card">
        <div class="card-body">

          <h4 class="auth-header">Welcome back</h4>

          <form method="post" id="login-form" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
              <label class="form-label" for="username">Username</label>
              <input
                id="username" name="username" type="text"
                class="form-control" required autofocus
                autocomplete="username"
                placeholder="your_username"
              >
            </div>

            <div class="mb-4">
              <label class="form-label" for="password">Password</label>
              <div class="input-pw-wrapper">
                <input
                  id="password" name="password" type="password"
                  class="form-control input-pw" required
                  autocomplete="current-password"
                  placeholder="••••••••••••"
                >
                <button type="button" class="btn-toggle-pw"
                  data-toggle-password="password"
                  aria-label="Toggle password visibility"
                >👁</button>
              </div>
            </div>

            <button class="btn btn-dark w-100 auth-submit-btn" type="submit" id="login-btn">
              Sign In
            </button>
          </form>

          <div class="auth-footer">
            <p class="small auth-footer-text">
              No account?
              <a href="{{ url_for('register') }}" class="auth-link-cyan">
                Create one →
              </a>
            </p>
          </div>

        </div>
      </div>

      <!-- Footer hint -->
      <div class="info-hint info-hint-center">
        🛡 AES-256-GCM encryption · RSA-OAEP key wrapping · Zero plaintext storage
      </div>

    </div>
  </div>
</div>

{% endblock %}
